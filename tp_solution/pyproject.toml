[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tp5-agentic-support"
version = "0.1.0"
description = "Projet pédagogique LangChain, LangGraph et MCP"
requires-python = ">=3.10"
dependencies = [
    "langchain>=1.0",
    "langchain-community>=0.4",
    "langchain-experimental>=0.4",
    "langchain-openai>=1.0",
    "langchain-text-splitters>=1.0",
    "langgraph>=1.0",
    "langgraph-cli[inmem]>=0.1",
    "mcp>=1.9,<2",
    "pypdf>=5.0",
    "python-dotenv>=1.0",
    "streamlit>=1.40",
    "tavily-python>=0.5",
    "duckduckgo-search>=7",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
